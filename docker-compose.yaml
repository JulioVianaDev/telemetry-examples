networks:
  monitoring:

volumes:
  backend_data:
  rabbitmq_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

services:
  db:
    image: postgres:15
    container_name: telemetry_db
    environment:
      POSTGRES_USER: guest
      POSTGRES_PASSWORD: guest
      POSTGRES_DB: backend
    ports:
      - "5432:5432"
    volumes:
      - backend_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "guest" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [monitoring]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_telemetry
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Grafana Tempo (Traces - replaces Jaeger)
  # ─────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo/config.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "9095:9095"
    networks: [monitoring]
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Grafana Loki (Logs)
  # ─────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.5
    container_name: loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./config/loki.yaml:/etc/loki/config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [monitoring]
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Prometheus (Metrics)
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [monitoring]
    restart: unless-stopped

  # ─────────────────────────────────────────
  # OpenTelemetry Collector
  # ─────────────────────────────────────────
  collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: otel_collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otel/config.yaml
    ports:
      - "9464:9464"
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    depends_on:
      - tempo
      - loki
      - prometheus
    networks: [monitoring]
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Grafana (UI - Dashboards)
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "5555:3000"
    networks: [monitoring]
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: unless-stopped
