# Slow log: capture commands taking more than 10ms (10000 microseconds)
slowlog-log-slower-than 10000

# Keep last 128 slow log entries
slowlog-max-len 128

# Enable keyspace notifications for monitoring
notify-keyspace-events KEA

# Connection limits
maxclients 10000

# Timeout for idle connections (0 = disabled)
timeout 0

# TCP keepalive
tcp-keepalive 300
